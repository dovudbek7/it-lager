{% extends 'quiz/base.html' %}
{% block title %}Yangi test yaratish{% endblock %}
{% block content %}
<div class="container" style="padding-top:2rem; max-width:520px;">
  <div class="page-header">
    <h1>Yangi test</h1>
    <p>Asosiy ma'lumotlarni kiriting</p>
  </div>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Test nomi</label>
        <input type="text" name="title" placeholder="Masalan: 12-yoshli mantiq testi" required>
      </div>
      <div class="form-group">
        <label>Tavsif (ixtiyoriy)</label>
        <textarea name="description" placeholder="Test haqida qisqacha..."></textarea>
      </div>
      <div class="form-group">
        <label>Vaqt chegarasi (daqiqa)</label>
        <input type="text" name="duration" value="30">
      </div>
      <div style="display:flex;gap:10px;margin-top:4px;">
        <a href="{% url 'quiz:dashboard' %}" class="btn">Bekor qilish</a>
        <button type="submit" class="btn btn-primary">Saqlash va savollar qo'shish →</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
