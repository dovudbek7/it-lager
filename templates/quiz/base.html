<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Test Platforma{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav>
  <div class="container-wide inner">
    <a href="{% url 'quiz:home' %}" class="brand">🧠 TestPlatform</a>
    <div class="nav-links">
      {% if user.is_authenticated %}
        <a href="{% url 'quiz:dashboard' %}" class="nav-link">Panel</a>
        <a href="{% url 'quiz:teacher_logout' %}" class="nav-link">Chiqish</a>
      {% else %}
        <a href="{% url 'quiz:teacher_login' %}" class="nav-btn">O'qituvchi</a>
      {% endif %}
    </div>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
