{% extends 'quiz/base.html' %}
{% block title %}O'qituvchi kirish{% endblock %}
{% block content %}
<div class="container" style="padding-top:3rem; max-width:400px;">
  <div class="page-header">
    <h1>O'qituvchi paneli</h1>
    <p>Davom etish uchun kiring</p>
  </div>
  {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Login</label>
        <input type="text" name="username" placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" name="password" placeholder="••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;">Kirish →</button>
    </form>
  </div>
</div>
{% endblock %}
